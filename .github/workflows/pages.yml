name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - "assets/icon.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/screenshots
          cp -r site/. _site/
          cp docs/screenshots/*.png _site/screenshots/
          cp assets/icon.png _site/icon.png
          cp assets/phosphor-subset.ttf _site/phosphor.ttf

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
